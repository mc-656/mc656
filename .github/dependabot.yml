version: 2
updates:
    - package-ecosystem: maven
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(deps)'
    - package-ecosystem: github-actions
      directory: /
      target-branch: develop
      schedule:
          interval: weekly
      commit-message:
          prefix: 'ci(deps)'
