name: CI
on:
    push:
        branches:
            - main
            - develop
            - 'release/**'
    pull_request:
        branches:
            - main
            - develop
            - 'release/**'
permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Executar Maven
              run: ./mvnw -B clean package -DskipTests
        timeout-minutes: 15
    lint:
        name: Lint
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-lint-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Verificar formatação
              run: ./mvnw -B spotless:check
        timeout-minutes: 10
    test:
        name: Test & Coverage
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-test-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: mave <sonar.organization>mc-656</sonar.organization>n
            - name: Tornar mvnw executável
              run: chmod +x mvnw
            - name: Executar Testes com Cobertura
              run: ./mvnw -B clean test
            - name: Exibir resumo da cobertura no log
              if: always()
              run: |
                echo "=== Resumo dos Relatórios de Cobertura ==="
                if [ -d "target/site/jacoco" ]; then
                  ls -lh target/site/jacoco/
                  echo "Relatórios gerados com sucesso."
                else
                  echo "Diretório de cobertura não encontrado. Verifique se os testes rodaram."
                fi
                echo "### 📊 Cobertura de Testes (JaCoCo)" >> $GITHUB_STEP_SUMMARY
                echo "O relatório completo em HTML está disponível para download na seção de **Artifacts** desta execução." >> $GITHUB_STEP_SUMMARY
            - name: Publicar relatório como Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: jacoco-coverage-report
                path: target/site/jacoco/
                retention-days: 14
        timeout-minutes: 15

    sonar:
      name: "analyze"
      runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=mc-656_mc656
