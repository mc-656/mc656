name: CI
on:
    push:
        branches:
            - main
            - develop
            - 'release/**'
    pull_request:
        branches:
            - main
            - develop
            - 'release/**'
permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Executar Maven
              run: ./mvnw -B clean package -DskipTests
        timeout-minutes: 15
    lint:
        name: Lint
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-lint-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Verificar formatação
              run: ./mvnw -B spotless:check
        timeout-minutes: 10
    spotbugs:
        name: SpotBugs
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-spotbugs-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            # Mesmo goal que roda na fase verify; aqui sem testes para dar feedback rápido.
            - name: Análise estática (SpotBugs)
              run: ./mvnw -B -DskipTests compile spotbugs:check
        timeout-minutes: 15
    test:
        name: Test & Coverage
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-test-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Tornar mvnw executável
              run: chmod +x mvnw
            # verify roda os testes, gera o relatório (fase test) e aplica o gate
            # jacoco:check (fase verify): o build falha abaixo dos mínimos do pom.xml.
            - name: Executar testes e gate de cobertura
              run: ./mvnw -B clean verify
            - name: Publicar resumo da cobertura
              if: always()
              run: |
                CSV=target/site/jacoco/jacoco.csv
                # Se algum teste falhou, o surefire interrompe o build antes do jacoco:report;
                # gera o relatório a partir do jacoco.exec para não perder a cobertura da execução.
                if [ ! -f "$CSV" ] && [ -f target/jacoco.exec ]; then
                  ./mvnw -B -q jacoco:report || true
                fi
                limite() { sed -n "s:.*<jacoco.minimo.$1>\(.*\)</jacoco.minimo.$1>.*:\1:p" pom.xml; }
                {
                  echo "### Cobertura de testes (JaCoCo)"
                  echo
                  if [ ! -f "$CSV" ]; then
                    echo "Relatório \`$CSV\` não encontrado: os testes não chegaram a gerar cobertura."
                  else
                    awk -F, -v linha="$(limite linha)" -v branch="$(limite branch)" -v apuracao="$(limite apuracao)" '
                      function pct(c, m) { return (c + m) == 0 ? "n/a" : sprintf("%.2f%%", 100 * c / (c + m)) }
                      function lim(v) { return sprintf("%.0f%%", 100 * v) }
                      function ehApuracao(p, c) {
                        return (p == "com.unicamp.engsoft.eleicao.votacao.service" && c ~ /^(MotorApuracao|Desempate)/) \
                          || (p == "com.unicamp.engsoft.eleicao.votacao.domain" && c ~ /^(ResultadoApuracao|Totalizacao|OpcaoApurada|VotoApuravel)$/) \
                          || p ~ /^com\.unicamp\.engsoft\.eleicao\..*\.apuracao(\.|$)/
                      }
                      NR > 1 {
                        im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9
                        if (ehApuracao($2, $3)) {
                          n++; nome[n] = $3; cl[n] = pct($9, $8); cb[n] = pct($7, $6)
                          alm += $8; alc += $9; abm += $6; abc += $7
                        }
                      }
                      END {
                        print "| Escopo | Linhas | Branches | Mínimo exigido |"
                        print "| --- | --- | --- | --- |"
                        printf "| Global | %s | %s | %s linhas / %s branches |\n", pct(lc, lm), pct(bc, bm), lim(linha), lim(branch)
                        printf "| Apuração (agregado) | %s | %s | %s por classe |\n", pct(alc, alm), pct(abc, abm), lim(apuracao)
                        print ""
                        printf "Instruções (global): %s\n\n", pct(ic, im)
                        print "<details><summary>Classes de apuração</summary>"
                        print ""
                        print "| Classe | Linhas | Branches |"
                        print "| --- | --- | --- |"
                        for (i = 1; i <= n; i++) printf "| `%s` | %s | %s |\n", nome[i], cl[i], cb[i]
                        print ""
                        print "</details>"
                      }' "$CSV"
                    echo
                    echo "O relatório HTML completo está nos **Artifacts** desta execução (\`jacoco-coverage-report\`)."
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
            - name: Publicar relatório como Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: jacoco-coverage-report
                path: target/site/jacoco/
                retention-days: 14
        timeout-minutes: 15
    mutation:
        name: Mutation (PIT)
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-mutation-${{ github.ref }}
            cancel-in-progress: true
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - uses: actions/setup-java@v6
              name: Setup Java
              with:
                distribution: temurin
                java-version: '21'
                cache: maven
            - name: Tornar mvnw executável
              run: chmod +x mvnw
            # Só os testes de unidade da apuração (ver pom.xml): roda em segundos, então cabe em
            # todo PR. O goal falha se o score ficar abaixo de pit.minimo.mutacao.
            - name: Teste de mutação no motor de apuração
              run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
            - name: Publicar resumo da mutação
              if: always()
              run: |
                XML=target/pit-reports/mutations.xml
                {
                  echo "### Teste de mutação (PIT)"
                  echo
                  if [ ! -f "$XML" ]; then
                    echo "Relatório \`$XML\` não encontrado: a análise não chegou ao fim."
                  else
                    python3 -I - "$XML" "$(sed -n 's:.*<pit.minimo.mutacao>\(.*\)</pit.minimo.mutacao>.*:\1:p' pom.xml)" <<'PY'
                import collections, sys, xml.etree.ElementTree as ET
                mutantes = list(ET.parse(sys.argv[1]).getroot())
                status = collections.Counter(m.get("status") for m in mutantes)
                mortos = status["KILLED"] + status["TIMED_OUT"] + status["MEMORY_ERROR"]
                score = 100 * mortos / len(mutantes) if mutantes else 100
                print("| Mutantes | Mortos | Sobreviventes | Sem cobertura | Score | Mínimo |")
                print("| --- | --- | --- | --- | --- | --- |")
                print(f"| {len(mutantes)} | {mortos} | {status['SURVIVED']} | {status['NO_COVERAGE']} | {score:.1f}% | {sys.argv[2]}% |")
                vivos = [m for m in mutantes if m.get("status") in ("SURVIVED", "NO_COVERAGE")]
                if vivos:
                    print()
                    print("| Status | Classe | Linha | Mutação |")
                    print("| --- | --- | --- | --- |")
                    for m in vivos:
                        classe = m.findtext("mutatedClass").rsplit(".", 1)[-1]
                        print(f"| {m.get('status')} | `{classe}` | {m.findtext('lineNumber')} | {m.findtext('description')} |")
                PY
                    echo
                    echo "O relatório HTML completo está nos **Artifacts** desta execução (\`pit-mutation-report\`)."
                  fi
                } >> "$GITHUB_STEP_SUMMARY"
            - name: Publicar relatório como Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: pit-mutation-report
                path: target/pit-reports/
                retention-days: 14
        timeout-minutes: 15
