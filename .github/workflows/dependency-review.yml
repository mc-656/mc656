name: Dependency Review
on:
    pull_request:
        branches:
            - main
            - develop
            - 'release/**'
permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-review:
        name: Dependency Review
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              name: Checkout
            - name: Revisar dependências
              uses: actions/dependency-review-action@v4
              with:
                # Falha o PR se ele introduzir dependência com vulnerabilidade alta ou crítica.
                fail-on-severity: high
                comment-summary-in-pr: on-failure
        timeout-minutes: 10
