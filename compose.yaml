services:
  postgres:
    image: postgres:17-alpine
    container_name: eleicao-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eleicao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP falso para desenvolvimento (RF-17): captura os e-mails de convite sem enviá-los de verdade.
  # SMTP em 1025, interface web em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: eleicao-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  # Imagem da API (Dockerfile). Opcional: só sobe com `docker compose --profile app up -d`,
  # então `make db-up` continua subindo apenas o Postgres.
  app:
    profiles: ["app"]
    build: .
    image: eleicao:local
    container_name: eleicao-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      HMAC: ${HMAC}
      COMPROVANTE_CHAVE: ${COMPROVANTE_CHAVE}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  eleicao-pgdata:
