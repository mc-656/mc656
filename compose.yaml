services:
  postgres:
    image: postgres:17-alpine
    container_name: eleicao-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - eleicao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SMTP falso para desenvolvimento (RF-17): captura os e-mails de convite sem enviá-los de verdade.
  # SMTP em 1025, interface web em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: eleicao-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  eleicao-pgdata:
