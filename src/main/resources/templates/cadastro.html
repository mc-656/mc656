<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Cadastro</title>
</head>
<body>
<main layout:fragment="conteudo" class="cartao">
    <h1>Criar conta</h1>

    <!-- novalidate: as mensagens vêm do Bean Validation do servidor, iguais às da API. -->
    <form th:action="@{/cadastro}" th:object="${cadastro}" method="post" novalidate>
        <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}" class="alerta erro"></p>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" th:value="*{nome}" autocomplete="name"
               th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
        <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="erro-campo"></p>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" th:value="*{cpf}" inputmode="numeric"
               placeholder="Somente números"
               th:classappend="${#fields.hasErrors('cpf')} ? 'invalido'">
        <p th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="erro-campo"></p>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" th:value="*{email}" autocomplete="username"
               th:classappend="${#fields.hasErrors('email')} ? 'invalido'">
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="erro-campo"></p>

        <!-- A senha nunca volta preenchida quando o formulário é reexibido com erro. -->
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="new-password"
               th:classappend="${#fields.hasErrors('senha')} ? 'invalido'">
        <p th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}" class="erro-campo"></p>

        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a th:href="@{/login}">Entrar</a>.</p>
</main>
</body>
</html>
