<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${dados.eleicao.nome}">Candidatos</title>
</head>
<body>
<main layout:fragment="conteudo" id="conteudo-principal" tabindex="-1" class="pagina">
    <p class="voltar"><a th:href="@{/eleicoes-publicas}">← Eleições públicas</a></p>
    <h1 th:text="${dados.eleicao.nome}">Eleição</h1>
    <p class="atalhos">
        <a th:href="@{/eleicoes-publicas/{id}/comparar(id=${dados.eleicao.id})}" class="botao secundario pequeno">Comparar propostas de candidatos</a>
        <a th:href="@{/eleicoes-publicas/{id}/conteudos(id=${dados.eleicao.id})}" class="botao secundario pequeno">Notícias e resumos de debates</a>
    </p>
    <p th:replace="~{eleicoes-publicas/fonte :: fonte(${dados.eleicao.fonte})}"></p>

    <section th:each="cargo : ${dados.cargos}">
        <h2 th:text="${cargo.nome}">Cargo</h2>
        <p th:if="${#lists.isEmpty(cargo.candidatos)}">Nenhum candidato registrado para este cargo.</p>
        <ul class="cartoes">
            <li th:each="c : ${cargo.candidatos}" class="cartao-eleicao">
                <a th:href="@{/eleicoes-publicas/candidatos/{id}(id=${c.id})}">
                    <strong th:text="${c.nomeUrna}">Nome de urna</strong>
                </a>
                <span class="numero-urna"><b th:text="${c.numero}">91</b> <span th:text="${c.partidoSigla}">PEX</span></span>
                <p th:replace="~{eleicoes-publicas/fonte :: fonte(${c.fonte})}"></p>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
