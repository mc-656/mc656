<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head>
    <title>Início</title>
</head>
<body>
<main layout:fragment="conteudo" id="conteudo-principal" tabindex="-1" class="pagina">
    <div class="cabecalho-pagina">
        <h1>Bem-vindo</h1>
        <p class="suave">Conectado como <strong sec:authentication="name">usuario@example.com</strong>.</p>
    </div>
    <!-- O cartão inteiro é o link: o título diz para onde vai, a linha de baixo diz o que se faz lá. -->
    <ul class="atalhos-inicio">
        <li><a th:href="@{/votacoes}"><strong>Minhas votações</strong><span>Votar, acompanhar e ver resultados</span></a></li>
        <li><a th:href="@{/votacoes/nova}"><strong>Criar votação</strong><span>Eleição privada ou orçamento participativo</span></a></li>
        <li><a th:href="@{/comprovantes/verificar}"><strong>Verificar comprovante</strong><span>Confirmar que sua cédula foi registrada</span></a></li>
        <li><a th:href="@{/eleicoes-publicas}"><strong>Eleições públicas</strong><span>Consultar eleições públicas e candidatos</span></a></li>
    </ul>
</main>
</body>
</html>
