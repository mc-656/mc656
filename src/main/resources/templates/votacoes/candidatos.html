<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Candidatos</title>
    <link rel="stylesheet" th:href="@{/css/votacoes.css}">
</head>
<body>
<main layout:fragment="conteudo" class="cartao largo">
    <header th:replace="~{votacoes/fragmentos :: cabecalho(${v}, 'candidatos')}"></header>
    <div th:replace="~{votacoes/fragmentos :: mensagens}"></div>

    <section aria-labelledby="titulo-lista">
        <h2 id="titulo-lista">Candidatos/chapas</h2>
        <p th:if="${#lists.isEmpty(candidatos)}">Nenhum candidato/chapa cadastrado.</p>
        <ul th:unless="${#lists.isEmpty(candidatos)}" class="lista-itens">
            <li th:each="c : ${candidatos}">
                <div>
                    <strong th:text="${c.nome}">Chapa</strong>
                    <span th:if="${c.descricao}" th:text="${c.descricao}" class="suave"></span>
                </div>
                <form th:if="${editavel}" class="inline"
                      th:action="@{/votacoes/{id}/candidatos/{c}/remover(id=${v.id},c=${c.id})}"
                      method="post">
                    <button type="submit" class="link" th:aria-label="|Remover ${c.nome}|">Remover</button>
                </form>
            </li>
        </ul>
    </section>

    <section aria-labelledby="titulo-novo">
        <h2 id="titulo-novo">Cadastrar candidato/chapa</h2>
        <th:block th:unless="${editavel}"><p th:replace="~{votacoes/fragmentos :: bloqueada}"></p></th:block>

        <form th:if="${editavel}" th:action="@{/votacoes/{id}/candidatos(id=${v.id})}"
              th:object="${candidato}" method="post" novalidate>
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}" class="alerta erro" role="alert"></p>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" th:value="*{nome}" maxlength="100"
                   th:classappend="${#fields.hasErrors('nome')} ? 'invalido'">
            <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="erro-campo"></p>

            <label for="descricao">Descrição (opcional)</label>
            <textarea id="descricao" name="descricao" maxlength="255" rows="2"
                      th:text="*{descricao}"
                      th:classappend="${#fields.hasErrors('descricao')} ? 'invalido'"></textarea>
            <p th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="erro-campo"></p>

            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>
</body>
</html>
